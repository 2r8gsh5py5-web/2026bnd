<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 BND 연말 결산</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --c:#8fa9e0; --ink:#1f2f55; --onc:#243a6b; --paper:#f4f4f2; --tile:#eef2fb; --line:#c5d2ef; --lab:#dbe3f6;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{overscroll-behavior:none}
html.snap,html.snap body{height:auto;overflow:visible}
body{margin:0;background:var(--c);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;transition:background .3s}
.wrap{max-width:393px;margin:0 auto;padding:4px 12px 16px;transform-origin:top center}
#cap{background:var(--c);padding:6px 0 4px}
.paper{position:relative;background:var(--paper);padding:36px 14px 30px;
  background-image:linear-gradient(rgba(0,0,0,.03) 1px,transparent 1px);background-size:100% 3px}
.paper::before,.paper::after{content:"";position:absolute;left:0;right:0;height:9px}
.paper::before{top:0;background:radial-gradient(circle at 10px 0,var(--c) 7px,transparent 7.5px) 0 0/20px 9px repeat-x}
.paper::after{bottom:0;background:radial-gradient(circle at 10px 100%,var(--c) 7px,transparent 7.5px) 0 0/20px 9px repeat-x}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #666;padding-bottom:12px;gap:8px}
.tag{border:1px solid #222;padding:3px 10px;font-size:11px;color:#222;background:#fff;letter-spacing:.03em}
.date{font-family:"Do Hyeon",sans-serif;font-size:13px;color:#333}
h1{font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-weight:400;text-align:center;margin:22px 0 8px;font-size:clamp(28px,7.5vw,50px);color:var(--ink);line-height:1.2}
.sub{text-align:center;color:#444;margin:0 0 16px;font-size:15px}
.dots{border-top:3px dotted #999;margin:0 0 20px}
.grid{display:grid;gap:16px 10px;margin-bottom:16px}
.r3{grid-template-columns:repeat(3,1fr)}.r2{grid-template-columns:repeat(2,1fr)}
.slot{min-width:0}
.lab{display:inline-block;background:var(--lab);padding:3px 12px 3px 10px;margin:0 0 8px -4px;font-weight:700;font-size:12px;color:var(--ink);transform:rotate(-.6deg)}
.tile{position:relative;width:100%;border:2px solid var(--line);border-radius:22px;background:var(--tile);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:13px;padding:0;background-size:cover;background-position:center 30%}
.r2 .tile.sq{aspect-ratio:1/1}
.r2 .tile.tl{aspect-ratio:1.45/1}
.r3 .tile{aspect-ratio:1/.9}.r2 .tile{aspect-ratio:2.2/1}
.tile span{opacity:.7;text-align:center;line-height:1.5}
.tile:hover,.tile:focus-visible{border-color:var(--ink);outline:none}
.cap{margin-top:8px;min-height:1.5em;font-size:11.5px;color:#222;text-align:center;border-bottom:1px dashed var(--line);padding:2px 4px;outline:none;word-break:keep-all;white-space:nowrap;overflow:hidden}
.cap:empty::before{content:attr(data-ph);color:#999}
.cap:focus{border-bottom-color:var(--ink)}
.tile.txt{cursor:text;padding:6px}
.tb{width:100%;max-height:100%;overflow-y:auto;outline:none;white-space:pre-wrap;word-break:keep-all;font-size:12.5px;line-height:1.45;color:#222;text-align:center}
.tb:empty::before{content:attr(data-ph);color:#8a8a8a}
.snap .cap:empty::before,.snap .tb:empty::before{content:""}
.snap .tile span{visibility:hidden}
.foot{text-align:center;color:var(--onc);letter-spacing:.2em;font-size:13px;margin:14px 0 0;font-weight:500}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.back{background:none;border:0;color:var(--onc);font:inherit;font-weight:700;padding:6px 2px;cursor:pointer}
.sv{border:0;border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-weight:700;font-size:13px;padding:8px 14px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.sv:disabled{opacity:.6}
.home h1{margin-top:6px}
.menu{display:grid;gap:14px;margin-top:8px}
.m1{grid-template-columns:1fr}.m3{grid-template-columns:repeat(3,1fr)}
.door{position:relative;border:0;padding:0;background:none;cursor:pointer;perspective:700px;width:100%;max-width:116px;margin:0 auto;aspect-ratio:2/3.1;font:inherit;-webkit-tap-highlight-color:transparent}
.frame{position:absolute;inset:0;border-radius:60px 60px 4px 4px;background:radial-gradient(circle at 50% 60%,#fffbe0,#ffe9a8);border:6px solid var(--fr);box-shadow:0 5px 0 rgba(0,0,0,.1)}
.leaf{position:absolute;inset:0;border-radius:54px 54px 2px 2px;background:var(--b);transform-origin:left center;transition:transform .8s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6)}
.pn{width:62%;height:21%;border:2px solid rgba(255,255,255,.75);border-radius:8px 8px 3px 3px;background:rgba(255,255,255,.22)}
.nm{font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-weight:400;font-size:clamp(18px,4.6vw,24px);color:var(--bt);font-style:normal}
.kn{position:absolute;right:11%;top:54%;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.door:hover .leaf,.door:focus-visible .leaf{transform:rotateY(-16deg)}
.door:focus-visible{outline:3px solid var(--ink);outline-offset:4px;border-radius:60px 60px 4px 4px}
.door.open .leaf{transform:rotateY(-108deg)}
.door.open{pointer-events:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;overflow:auto}
.sheet{background:#fff;border-radius:22px;padding:16px;max-width:360px;width:100%;text-align:center;color:#222}
.sheet h2{font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-weight:400;font-size:20px;margin:0 0 12px;color:var(--ink)}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pk button{aspect-ratio:1;border:3px solid transparent;border-radius:14px;background-size:cover;background-position:center 30%;padding:0;cursor:pointer}
.pk button.on,.pk button:focus-visible{border-color:var(--ink);outline:none}
.sheet .x{border:0;background:var(--lab);color:var(--ink);font:inherit;font-weight:700;border-radius:999px;padding:8px 20px;cursor:pointer}
.sheet img{width:100%;border-radius:12px;display:block;margin-bottom:10px}
.sheet p{margin:0 0 12px;font-size:13px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:10}
.tile.lk{background-color:#222;color:#fff;border-color:#222}
.ytp{text-align:center;font-size:12px;line-height:1.5;opacity:.95}.ytp small{opacity:.6;font-size:10px}
.li{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:14px;margin-bottom:6px;color:#222}
.er{min-height:1.2em;margin:0 0 8px;font-size:12px;color:#c33}
.dlk{display:block;font-size:12px;line-height:1.5;color:var(--ink);margin:0 0 10px;text-decoration:underline}.dlk[hidden]{display:none}
.bt{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
